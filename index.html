<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePulse AI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 16px; font-size: 14px; }
  select, textarea, button { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; padding: 12px; font-size: 16px; margin-bottom: 10px; }
  textarea { height: 220px; font-family: ui-monospace, monospace; font-size: 13px; }
  button { background: #2563eb; border: 0; font-weight: 600; }
  button.alt { background: #334155; }
  #score { font-size: 40px; font-weight: 700; margin: 12px 0 4px; }
  .item { background: #1e293b; border-left: 4px solid #f59e0b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .item.secret { border-color: #ef4444; }
  .item.syntax { border-color: #a855f7; }
  .item.undefined-name { border-color: #06b6d4; }
  .item small { color: #94a3b8; }
  .item.syntax small { color: #d8b4fe; }
  .item.undefined-name small { color: #67e8f9; }
  .fix { margin-top: 8px; }
  .fix .fixlabel { display: block; font-size: 12px; font-weight: 600; color: #4ade80; margin-bottom: 4px; }
  .fix pre { margin: 0; padding: 8px 10px; background: #0f172a; border: 1px solid #14532d; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; color: #bbf7d0; }

  /* Copy and clear buttons over the paste box (top right) */
  .box { position: relative; margin-bottom: 10px; }
  .box textarea { margin-bottom: 0; padding-top: 44px; }
  .tools { position: absolute; top: 6px; right: 8px; display: flex; gap: 6px; }
  .tools[hidden] { display: none; }
  .tools button { width: auto; margin: 0; padding: 5px 12px; font-size: 13px; font-weight: 600; border: 1px solid #475569; border-radius: 8px; background: #334155; color: #e2e8f0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>CodePulse AI</h1>
  <p class="sub">Paste code to see what the bot would comment on a pull request.</p>
  <select id="lang">
    <option value="sample.py">Python</option>
    <option value="sample.js">JavaScript</option>
    <option value="Sample.java">Java</option>
    <option value="sample.c">C / C++</option>
  </select>
  <div class="box">
    <div class="tools" id="tools" hidden>
      <button type="button" id="copy" aria-label="Copy code">Copy</button>
      <button type="button" id="clear" aria-label="Clear all code">&#10005;</button>
    </div>
    <textarea id="code" placeholder="Paste code here"></textarea>
  </div>
  <button id="run">Review code</button>
  <button class="alt" id="demo">Load a bad Python sample</button>
  <div id="out"></div>
</main>
<script>
var SAMPLE = [
  'import requests, json',
  'API_PASSWORD = "hunter2024"',
  '',
  'def get_user(url):',
  '    r = requests.get(url)',
  '    return json.loads(r.text)',
  '',
  'def save(x):',
  '    try:',
  '        open("a.txt").write(x)',
  '    except:',
  '        pass'
].join('\n');

var LABELS = {
  'syntax': 'syntax error',
  'undefined-name': 'undefined name'
};

var codeBox = document.getElementById('code');
var tools = document.getElementById('tools');
var copyBtn = document.getElementById('copy');

// show Copy / clear buttons only when the box has text
function syncTools() {
  tools.hidden = codeBox.value.length === 0;
}
codeBox.addEventListener('input', syncTools);
syncTools();

copyBtn.onclick = function () {
  var text = codeBox.value;
  function done() {
    copyBtn.textContent = 'Copied';
    setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1200);
  }
  function fallback() {
    codeBox.focus();
    codeBox.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    codeBox.setSelectionRange(text.length, text.length);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
};

document.getElementById('clear').onclick = function () {
  codeBox.value = '';
  syncTools();
  codeBox.focus();
};

document.getElementById('demo').onclick = function () {
  document.getElementById('lang').value = 'sample.py';
  codeBox.value = SAMPLE;
  syncTools();
};

document.getElementById('run').onclick = function () {
  var out = document.getElementById('out');
  out.textContent = 'Reviewing...';
  fetch('/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: document.getElementById('lang').value, content: document.getElementById('code').value })
  }).then(function (r) { return r.json(); }).then(function (d) {
    out.textContent = '';
    var s = document.createElement('div');
    s.id = 'score';
    s.textContent = d.score + '/100';
    out.appendChild(s);
    if (!d.findings.length) {
      var ok = document.createElement('p');
      ok.textContent = 'No issues found. The bot would stay quiet.';
      out.appendChild(ok);
      return;
    }
    d.findings.forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'item ' + f.rule;
      var small = document.createElement('small');
      small.textContent = 'Line ' + f.line + ' - ' + (LABELS[f.rule] || f.rule);
      el.appendChild(small);
      el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(f.message.replace(/\*\*|`/g, '')));
      if (f.fix) {
        var fx = document.createElement('div');
        fx.className = 'fix';
        var lab = document.createElement('span');
        lab.className = 'fixlabel';
        lab.textContent = 'Suggested fix';
        var pre = document.createElement('pre');
        pre.textContent = f.fix;
        fx.appendChild(lab);
        fx.appendChild(pre);
        el.appendChild(fx);
      }
      out.appendChild(el);
    });
  }).catch(function () { out.textContent = 'Something went wrong. Try again.'; });
};
</script>
</body>
</html>
